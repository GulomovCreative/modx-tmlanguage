name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Тесты идут поверх сторонних грамматик (shiki, vscode-textmate), и те живут
  # своей жизнью. package-lock закрепляет версии, поэтому их обновление видно
  # только в PR от dependabot — раз в месяц. Еженедельный прогон на свежих
  # версиях показывает поломку раньше и отдельно от изменений в коде.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Workflow только читает репозиторий: ни публикаций, ни комментариев, ни
# записи в ветки. Явное указание закрывает запись на случай, если права по
# умолчанию в настройках репозитория окажутся шире.
permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон: держать очередь
# проверок для кода, который уже неактуален, незачем.
#
# На master отмена не применяется. Там каждый коммит — состояние, из
# которого может уйти релиз, и его результат должен быть известен. Без
# этого условия быстрые мержи подряд отменяют проверку промежуточных
# коммитов, и в истории остаются коммиты со статусом cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Тесты (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Содержимое пакета
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Тесты проверяют, что установленный пакет работает. Этот файл — что в
      # него попадает ровно то, что задумано. Он входит и в npm test, то есть
      # идёт на всех версиях Node; отдельным job-ом он остаётся потому, что
      # это отдельная проверка с собственным именем в списке статусов.
      - name: Сверить состав тарбола
        run: node --test test/package.test.js

  fresh-deps:
    name: Свежие зависимости
    # Только по расписанию и по кнопке: на каждый PR это ставило бы проверку в
    # зависимость от чужих релизов, и красный статус означал бы не то, что с
    # изменением что-то не так.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Без package-lock: ставятся самые свежие версии, разрешённые диапазонами
      # в package.json. Именно то, что получит человек, клонировавший репозиторий
      # сегодня.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
