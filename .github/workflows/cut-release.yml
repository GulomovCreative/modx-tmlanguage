name: Cut a release

# The other half of releasing. This does what `npm version` does on a laptop --
# check that the release may be cut, close the changelog, bump the version,
# commit, tag and push -- so that cutting a release needs nothing but this page.
#
# It then calls the release workflow directly instead of letting the pushed tag
# start it. A push made with GITHUB_TOKEN deliberately starts no workflow, or a
# workflow could trigger itself without end.
#
# Running it needs one thing set up on the repository: the account Actions push
# as must be allowed to push to master, which on a protected branch means a
# bypass entry in the ruleset. Without it the push is rejected and nothing is
# released -- which is the safe direction to fail in.

on:
  workflow_dispatch:
    inputs:
      part:
        description: Which part of the version to raise
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

# Two releases at once would race for the same tag.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the version and push the tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          # preversion compares the branch with origin/master, so the whole
          # history has to be here; a shallow checkout would make it look behind.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The version commit and tag are made by npm, so git needs an author.
      - name: Identify the committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Raise the version
        id: version
        run: |
          npm version "$PART"
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
        env:
          PART: ${{ inputs.part }}

  release:
    name: Release
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
    permissions:
      contents: write
      id-token: write
