version: 2
updates:
  # The tokenizer every grammar test here runs on.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # Actions in CI are pinned to a major version and do not move on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
